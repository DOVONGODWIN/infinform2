<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Que 0,271 EUR ? t'es sure que c'est une villa ?</title>
<style>
  body {
    background: #FFFFFF;
    font-family: "Courier New", monospace;
    color: #2b2b2b;
    max-width: 520px;
    margin: 40px auto;
    padding: 0 24px;
    line-height: 1.5;
  }
  h1 { font-size: 20px; margin-bottom: 2px; }
  .subtitle { font-size: 12px; color: #777; margin-top: 0; border-bottom: 1px dotted #999; padding-bottom: 8px; }
  #countdown { font-size: 12px; color: #b00; margin-bottom: 8px; }
  .field { margin: 22px 0; }
  .label { font-weight: bold; font-size: 13px; display: block; margin-bottom: 4px; }
  .hint { font-weight: normal; color: #888; font-size: 11px; }
  input[type=text] {
    width: 100%; border: none; border-bottom: 1px dotted #999;
    background: transparent; padding: 4px 0; font-family: inherit; font-size: 13px;
  }
  input[type=text]:focus { outline: none; border-bottom: 1px solid #333; }
  input[type=range] { width: 100%; }
  .slider-row { display: flex; align-items: center; gap: 8px; }
  .slider-val { min-width: 48px; text-align: right; font-weight: bold; font-size: 13px; }
  .radio-group label { font-size: 12px; margin-right: 14px; }
  .checkbox-row { font-size: 13px; display: flex; align-items: center; gap: 6px; }
  .trap-msg { background: #e8e4d5; border: 1px solid #cfc9b5; padding: 8px 10px; font-size: 11px; color: #555; margin-top: 6px; }
  button {
    background: #dcd6c2; border: 1px solid #b7b09a; padding: 8px 18px;
    font-family: inherit; font-size: 13px; cursor: pointer; margin-top: 10px;
  }
  button:hover { background: #d0c9b2; }
  .step { border-top: 1px dashed #bbb; margin-top: 30px; padding-top: 10px; }

  /* ----- CANON ----- */
  .cannon-wrap { border: 1px dashed #b7b09a; padding: 10px; }
  .cannon-scene {
    position: relative; height: 30px; font-size: 18px; overflow: hidden;
    display: flex; align-items: center; gap: 6px;
  }
  .cannon-ball { transition: transform .8s ease-out; display: inline-block; }
  .cannon-target { margin-left: auto; color: #b00; font-weight: bold; }
  .cannon-readout { font-size: 12px; margin: 6px 0; }
  .cannon-btn { margin-top: 4px; }

  /* ----- BALANCE ----- */
  .balance-wrap { border: 1px dashed #b7b09a; padding: 10px; }
  .balance-beam {
    display: flex; justify-content: space-between; align-items: center;
    transition: transform .3s ease; transform-origin: center;
    border-top: 3px solid #555; padding-top: 6px; margin: 10px 0;
  }
  .balance-pan {
    width: 90px; height: 42px; border: 1px solid #999; border-radius: 0 0 40px 40px;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: bold; background: #f4f1e6;
  }
  .balance-readout { font-size: 12px; margin: 6px 0; }
  .balance-btn { margin-right: 6px; }
</style>
</head>
<body>

<div id="countdown"></div>
<div id="form-root"></div>

<script type="module">
  import { refresh_page } from './assets/js/refresh_page.js';
  const time = Number(localStorage.getItem('annonceTime')) || 30;
  const countdownEl = document.getElementById('countdown');
  refresh_page(time, (remain_time) => {
    countdownEl.textContent = `Rechargement dans ${remain_time}s...`;
  });
</script>


<script type="module" src="/assets/js/form_page.js"></script>

</body>
</html>

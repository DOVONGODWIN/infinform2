<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
<div id="countdown"></div>

<div id="form-container">test opening form</div>

<script type="module">
  import { refresh_page } from './refresh_page.js';

  const countdownEl = document.getElementById('countdown');

  refresh_page(10, (remain_time) => {
      countdownEl.textContent = `Rechargement dans ${remain_time}s...`;
  });
    </script>

<script>
  const fields = {
    "nom":   { "type": "string" },
    "age":   { "type": "integer" },
    "email": { "type": "string", "format": "email" }
  };

  const container = document.getElementById("form-container");

  for (const [key, prop] of Object.entries(fields)) {
    const input = document.createElement("input");
    input.type =
      prop.format === "email" ? "email" :
      prop.type === "integer" ? "number" : "text";
    input.id = input.name = key;

    const label = document.createElement("label");
    label.textContent = key;
    label.htmlFor = key;

    container.append(label, input);
  }
</script>




    
</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Que 0,271 EUR ? t'es sure que c'est une villa ?</title>


<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

<style>
  
  body {
    background: #FFFFFF;
    font-family: "Courier New", monospace;
    color: #2b2b2b;
    max-width: 560px;
    margin: 40px auto;
    padding: 0 24px;
  }
  h1 { font-size: 20px; margin-bottom: 2px; }
  .subtitle { font-size: 12px; color: #777; margin-top: 0; border-bottom: 1px dotted #999; padding-bottom: 8px; }
  #countdown { font-size: 12px; color: #b00; margin-bottom: 8px; }
  .field { margin: 22px 0; }
  .label { font-weight: bold; font-size: 13px; display: block; margin-bottom: 6px; }
  .hint { font-weight: normal; color: #888; font-size: 11px; }
  .trap-msg { background: #e8e4d5; border: 1px solid #cfc9b5; padding: 8px 10px; font-size: 11px; color: #555; margin-top: 6px; }
  .step { border-top: 1px dashed #bbb; margin-top: 30px; padding-top: 10px; }

  /* champs texte facon souligne, mais on garde la famille mono */
  input[type=text] {
    width: 100%; border: none; border-bottom: 1px dotted #999;
    background: transparent; padding: 4px 0; font-family: inherit; font-size: 13px;
  }
  input[type=text]:focus { outline: none; border-bottom: 1px solid #333; }

  /* slider classique */
  .slider-row { display: flex; align-items: center; gap: 8px; }
  input[type=range] { width: 100%; }
  .slider-val { min-width: 56px; text-align: right; font-weight: bold; font-size: 13px; }

  .radio-group label { font-size: 12px; margin-right: 14px; }
  .checkbox-row { font-size: 13px; display: flex; align-items: center; gap: 6px; }

  #form-root > .step > button {
    font-family: inherit;
  }

  .cannon-wrap {
    border: 1px solid #dee2e6; border-radius: .5rem;
    padding: 14px; background: #f8f9fa;
  }
  .cannon-scene {
    position: relative; height: 44px; font-size: 22px; overflow: hidden;
    display: flex; align-items: center; gap: 8px;
    background: linear-gradient(to bottom, #eef2f7 60%, #d7dee8 60%);
    border-radius: .4rem; padding: 0 10px;
  }
  .cannon-emoji { color: #495057; letter-spacing: -2px; }
  .cannon-ball {
    display: inline-block; color: #212529; font-weight: bold;
    will-change: transform;
  }
  .cannon-target {
    margin-left: auto; color: #dc3545; font-weight: bold; font-size: 15px;
    border: 1px dashed #dc3545; border-radius: .3rem; padding: 0 6px;
  }
  .charge-bar {
    height: 10px; background: #e9ecef; border-radius: 5px;
    overflow: hidden; margin: 10px 0 6px;
  }
  .charge-fill {
    height: 100%; width: 0%;
    background: linear-gradient(90deg, #ffc107, #fd7e14, #dc3545);
    transition: width .05s linear;
  }
  .cannon-readout { font-size: 12px; margin-bottom: 8px; color: #495057; }
  .cannon-btn {
    display: inline-block; width: 100%;
    background: #0d6efd; color: #fff; border: none;
    padding: 8px 14px; border-radius: .4rem; cursor: pointer;
    font-family: inherit; font-size: 13px; user-select: none;
  }
  .cannon-btn:hover { background: #0b5ed7; }
  .cannon-btn.charging {
    background: #dc3545; transform: scale(.98);
  }


  .balance-wrap {
    border: 1px solid #dee2e6; border-radius: .5rem;
    padding: 14px; background: #f8f9fa;
  }
  .balance-track {
    position: relative; height: 70px; margin: 6px 0 4px;
    display: flex; align-items: center; justify-content: center;
    cursor: grab;
  }
  .balance-track.dragging { cursor: grabbing; }
  
  .balance-track::after {
    content: ""; position: absolute; bottom: 6px; left: 50%;
    transform: translateX(-50%);
    border-left: 12px solid transparent; border-right: 12px solid transparent;
    border-bottom: 16px solid #6c757d;
  }
  .balance-beam {
    position: relative; width: 90%; height: 8px;
    background: linear-gradient(90deg, #adb5bd, #495057, #adb5bd);
    border-radius: 4px; transform-origin: center;
    transition: transform .08s linear;
  }
  .balance-ball {
    position: absolute; top: -12px; left: 50%;
    width: 20px; height: 20px; margin-left: -10px;
    background: radial-gradient(circle at 30% 30%, #fff, #0d6efd 70%);
    border-radius: 50%; box-shadow: 0 2px 4px rgba(0,0,0,.3);
    transition: left .08s linear;
  }
  .balance-target-marker {
    position: absolute; top: -26px; transform: translateX(-50%);
    color: #dc3545; font-weight: bold; font-size: 12px;
    border-bottom: 2px solid #dc3545; padding-bottom: 2px;
  }
  .balance-scale {
    display: flex; justify-content: space-between;
    font-size: 11px; color: #888; padding: 0 5%;
  }
  .balance-readout { font-size: 12px; margin-top: 6px; color: #495057; }
</style>
</head>
<body>

<div id="countdown"></div>
<div id="form-root"></div>


<script type="module">
  import { refresh_page } from '/assets/js/refresh_page.js';
  const time = Number(localStorage.getItem('annonceTime')) || 30;
  const countdownEl = document.getElementById('countdown');
  refresh_page(time, (remain_time) => {
    countdownEl.textContent = `Rechargement dans ${remain_time}s...`;
  });
</script>


<script type="module" src="/assets/js/form_page.js"></script>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

</body>
</html>
